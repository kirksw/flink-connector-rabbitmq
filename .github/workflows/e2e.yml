name: Flink RabbitMQ end-to-end tests
on: workflow_call
permissions:
  contents: read
jobs:
  local_e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flink: ['1.20.5', '2.3.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Build and run the local E2E suite
        run: nix run .#e2e -- --flink '${{ matrix.flink }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-${{ matrix.flink }}-logs
          path: /tmp/rmq-e2e-*/**/*.log
          if-no-files-found: ignore
